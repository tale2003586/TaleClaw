<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fa" />
    <link rel="icon" type="image/svg+xml" href="/static/app/favicon.svg" />
    <title>TaleClaw Console</title>
    <script>
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("taleclawTheme");
        } catch {}
        const valid = stored === "light" || stored === "dark";
        let prefersDark = false;
        try {
          prefersDark = !valid && typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch {}
        const theme = valid ? stored : prefersDark ? "dark" : "light";
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === "dark" ? "#080e18" : "#f4f7fa";
      })();
    </script>
    <script type="module" crossorigin src="/static/app/assets/index-B3-d_BcJ.js"></script>
    <link rel="stylesheet" crossorigin href="/static/app/assets/index-DNofYoSC.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
